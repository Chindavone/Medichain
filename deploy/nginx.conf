server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 128k;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  # ponytail: open JSON-RPC to the POC chain; restrict methods before anything beyond a demo
  location = /rpc {
    proxy_pass http://chain:8545/;
  }
  # Hashed bundles never change; the HTML that points at them must always be revalidated,
  # otherwise browsers keep running the previous release after a deploy.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
